data:
    dataset: "MitEM"
    image_size: 512
    channels: 3
    logit_transform: false
    uniform_dequantization: false
    gaussian_dequantization: false
    random_flip: true
    rescaled: true
    num_workers: 0
    subset_1k: True
    out_of_dist: False

model:
    type: "openai"
    in_channels: 3
    out_channels: 3
    num_channels: 64
    num_heads: 4
    num_res_blocks: 2
    attention_resolutions: "32,16,8"
    dropout: 0.0
    resamp_with_conv: True
    learn_sigma: True
    use_scale_shift_norm: true
    use_fp16: false
    resblock_updown: true
    var_type: 'fixedsmall'
    num_head_channels: 64
    image_size: 512
    use_new_attention_order: true

diffusion:
    beta_schedule: linear
    beta_start: 0.0001
    beta_end: 0.02
    num_diffusion_timesteps: 1000

sampling:
    batch_size: 1
    last_only: True

phase1_weak_detail:
    enabled: true
    weak_map:
        hf_weight: 0.34
        coherence_weight: 0.20
        ridge_weight: 0.22
        support_weight: 0.24
    agreement:
        floor: 0.18
        sharpness: 3.2
    nonlinear_budget:
        deblur_em:
            global: 0.09
            local: 0.16
        inp_em:
            global: 0.07
            local: 0.14
    inpaint_short_range:
        max_hops: 3
        max_direction_change: 35
        max_connect_distance_px: 5
    deblur_thin_membrane:
        preserve_boost: 0.40
        dc_relax: 0.75
    adaptive_postprocess_suppression:
        enabled: true
        weak_scene_p95_ref: 0.085
    detail_survival:
        deblur_floor: 0.78
        inpaint_floor: 0.80

phase2_weak_detail:
    enabled: true
    tasks:
        deno_em:
            nonlinear_budget_global: 0.08
            nonlinear_budget_local: 0.14
            survival_floor: 0.76
        isotropic_em:
            nonlinear_budget_global: 0.09
            nonlinear_budget_local: 0.15
            survival_floor: 0.77
        sr:
            nonlinear_budget_global: 0.09
            nonlinear_budget_local: 0.16
            survival_floor: 0.75
    postprocess:
        adaptive_suppression: true
